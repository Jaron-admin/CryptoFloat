name: 功能建议 / Feature request
description: 提出使用场景或改进建议 / Suggest a use case or improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议，说明实际使用场景。请勿在公开内容中填写密钥或私人数据。
        Search existing requests first and describe your use case. Do not include secrets or private data in public content.
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem to solve
      description: 描述使用场景、遇到的困难和影响。 / Describe the use case, the difficulty, and its impact.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed solution
      description: 说明你希望 DuoMonitor 如何工作。 / Describe how you would like DuoMonitor to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选） / Alternatives (optional)
      description: 考虑或尝试过哪些替代方法？没有也可以说明。 / Describe alternatives considered or tried, or state that there are none.
