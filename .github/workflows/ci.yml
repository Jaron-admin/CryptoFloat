name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: flutter_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          architecture: x64

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      # The native taskbar suite is not included yet: its behavior on a GitHub-hosted
      # Windows runner and its desktop/session assumptions have not been verified.
      # Keep native checks and real-desktop validation in docs/verification.
      # TODO: Confirm the first hosted run completes successfully.
